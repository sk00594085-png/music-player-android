name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:        # allows you to trigger the build manually from the GitHub UI

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up JDK 17 (required by Gradle 8.4)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Grant execute permission for gradlew
      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # 4. Build the debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 5. Upload the APK as a downloadable artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30       # artifact stays available for 30 days
